<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotoMap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <!-- Top bar -->
      <header class="topbar">
        <div class="topbar-left">
          <span class="app-logo material-symbols-rounded">photo_camera</span>
          <span class="app-title">PhotoMap</span>
          <button id="import-btn" class="btn btn-filled">
            <span class="material-symbols-rounded">add_photo_alternate</span>
            <span data-i18n="import">Import</span>
          </button>
          <button id="fit-btn" class="btn btn-icon" data-i18n-title="fit" title="Fit">
            <span class="material-symbols-rounded">center_focus_strong</span>
          </button>
        </div>

        <div class="topbar-search">
          <span class="material-symbols-rounded search-icon">search</span>
          <input id="search-input" type="text" data-i18n-placeholder="search" placeholder="Search" />
        </div>

        <div class="topbar-right">
          <div class="menu-anchor">
            <button id="basemap-btn" class="btn btn-icon" data-i18n-title="basemap" title="Base map">
              <span class="material-symbols-rounded">layers</span>
            </button>
            <div id="basemap-menu" class="menu menu-wide hidden"></div>
          </div>

          <div class="menu-anchor">
            <button id="export-btn" class="btn btn-icon" data-i18n-title="export" title="Export">
              <span class="material-symbols-rounded">download</span>
            </button>
            <div id="export-menu" class="menu hidden">
              <button id="export-kml" class="menu-item">
                <span class="material-symbols-rounded">map</span>
                <span data-i18n="exportKml">KML</span>
              </button>
              <button id="export-geojson" class="menu-item">
                <span class="material-symbols-rounded">data_object</span>
                <span data-i18n="exportGeoJson">GeoJSON</span>
              </button>
              <button id="export-png" class="menu-item">
                <span class="material-symbols-rounded">image</span>
                <span data-i18n="exportPng">PNG</span>
              </button>
            </div>
          </div>

          <button id="theme-btn" class="btn btn-icon" data-i18n-title="theme" title="Theme">
            <span id="theme-icon" class="material-symbols-rounded">dark_mode</span>
          </button>
          <button id="lang-btn" class="btn btn-lang" title="Language">EN</button>
          <button id="settings-btn" class="btn btn-icon" data-i18n-title="settings" title="Settings">
            <span class="material-symbols-rounded">settings</span>
          </button>
        </div>
      </header>

      <!-- Main area -->
      <div id="main">
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-header">
            <div class="sidebar-filters">
              <select id="album-filter" class="select select-grow" title="Album">
                <option value="all" data-i18n="allAlbums">All albums</option>
              </select>
              <select id="sort-select" class="select" title="Sort">
                <option value="date" data-i18n="sortDate">By date</option>
                <option value="name" data-i18n="sortName">By name</option>
              </select>
            </div>
            <div class="sidebar-meta">
              <div id="photo-count" class="photo-count"></div>
              <button id="clear-btn" class="btn btn-icon btn-small" data-i18n-title="clear" title="Clear">
                <span class="material-symbols-rounded">delete_sweep</span>
              </button>
            </div>
          </div>
          <div id="photo-list" class="photo-list"></div>
          <div id="no-results" class="no-results hidden" data-i18n="noResults">Nothing found</div>
        </aside>

        <div id="map"></div>

        <!-- Empty state (over the map only) -->
        <div id="empty-state" class="empty-state">
          <span class="empty-icon material-symbols-rounded">explore</span>
          <h2 data-i18n="emptyTitle">Add your photos</h2>
          <p data-i18n="emptyText">Drop a folder here or press Import. Coordinates and direction are read from EXIF.</p>
          <button id="empty-import-btn" class="btn btn-filled btn-large">
            <span class="material-symbols-rounded">add_photo_alternate</span>
            <span data-i18n="import">Import</span>
          </button>
        </div>
      </div>

      <!-- Drag & drop overlay -->
      <div id="drop-overlay" class="drop-overlay hidden">
        <span class="material-symbols-rounded">cloud_upload</span>
        <p data-i18n="dropHint">Drop to import</p>
      </div>

      <!-- Scan progress overlay -->
      <div id="scan-overlay" class="scan-overlay hidden">
        <div class="scan-card">
          <div class="spinner"></div>
          <div id="scan-text" class="scan-text"></div>
        </div>
      </div>

      <!-- Settings panel -->
      <div id="settings-panel" class="settings hidden">
        <div class="settings-card">
          <div class="settings-head">
            <h3 data-i18n="settings">Settings</h3>
            <button id="settings-close" class="btn btn-icon">
              <span class="material-symbols-rounded">close</span>
            </button>
          </div>

          <div class="settings-section">
            <div class="settings-label" data-i18n="theme">Theme</div>
            <div class="segmented">
              <button class="seg" data-scheme="system" data-i18n="themeSystem">System</button>
              <button class="seg" data-scheme="light" data-i18n="themeLight">Light</button>
              <button class="seg" data-scheme="dark" data-i18n="themeDark">Dark</button>
            </div>
          </div>

          <div class="settings-section">
            <div class="settings-label" data-i18n="accentColor">Accent color</div>
            <div id="accent-presets" class="accent-presets"></div>
            <label class="accent-custom">
              <span data-i18n="custom">Custom</span>
              <input id="accent-custom" type="color" value="#6750a4" />
            </label>
          </div>

          <div class="settings-section">
            <div class="settings-label" data-i18n="language">Language</div>
            <div class="segmented">
              <button class="seg" data-lang="ru">Русский</button>
              <button class="seg" data-lang="en">English</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Lightbox -->
      <div id="lightbox" class="lightbox hidden">
        <div class="lightbox-top">
          <button id="lightbox-close" class="btn btn-icon lightbox-close">
            <span class="material-symbols-rounded">close</span>
          </button>
          <button id="lightbox-reveal" class="btn btn-icon" data-i18n-title="reveal" title="Reveal">
            <span class="material-symbols-rounded">folder_open</span>
          </button>
        </div>
        <button id="lightbox-prev" class="btn btn-icon lightbox-nav lightbox-prev">
          <span class="material-symbols-rounded">chevron_left</span>
        </button>
        <div class="lightbox-stage">
          <img id="lightbox-img" alt="" />
        </div>
        <button id="lightbox-next" class="btn btn-icon lightbox-nav lightbox-next">
          <span class="material-symbols-rounded">chevron_right</span>
        </button>
        <div id="lightbox-info" class="lightbox-info"></div>
      </div>

      <!-- Toast -->
      <div id="toast" class="toast hidden"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
